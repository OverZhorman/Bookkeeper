[project]
name = "bookkeeper"
version = "0.1.0"
description = "A personal catalog of books and web novels from many sites, with merged tags and automatic first-person detection"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "playwright>=1.44",
]

[project.scripts]
bookkeeper = "bookkeeper.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bookkeeper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
