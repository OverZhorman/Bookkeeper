<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookkeeper</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='4' width='22' height='24' rx='3' fill='%234c5fd5'/%3E%3Crect x='9' y='9' width='14' height='2.5' rx='1' fill='white'/%3E%3Crect x='9' y='14' width='10' height='2.5' rx='1' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/library" aria-label="Bookkeeper home">
    <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect x="5" y="4" width="22" height="24" rx="3" fill="var(--accent)"/><rect x="9" y="9" width="14" height="2.5" rx="1" fill="#fff"/><rect x="9" y="14" width="10" height="2.5" rx="1" fill="#fff"/></svg>
    <span>Bookkeeper</span>
    <small class="version" id="app-version" title="Bookkeeper version"></small>
  </a>
  <form class="search" id="search-form" role="search">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="q" type="search" placeholder="Search titles, authors, descriptions…" autocomplete="off">
  </form>
  <nav class="tabs" id="tabs">
    <a href="#/library" data-view="library">Library</a>
    <a href="#/sites" data-view="sites">Sites</a>
    <a href="#/downloads" data-view="downloads">Downloads</a>
    <a href="#/help" data-view="help">Help</a>
  </nav>
  <button class="icon-btn" id="theme-btn" title="Light / dark" aria-label="Switch light or dark theme">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" fill="currentColor"/></svg>
  </button>
</header>
<main id="app"></main>
<aside class="drawer" id="drawer" aria-hidden="true"><div class="drawer-inner" id="drawer-inner"></div></aside>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast" role="status"></div>
<script type="module" src="/static/app.js"></script>
</body>
</html>
